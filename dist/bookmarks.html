  <script nonce="rekonime-inline">
    (function () {
      try {
        var raw = localStorage.getItem('rekonime.bookmarks');
        if (!raw) return;
        var data = JSON.parse(raw);
        if (!data || typeof data !== 'object') return;
        var items = Array.isArray(data) ? null : data.items;
        if (!Array.isArray(items) || items.length === 0) return;
        var cover = items[0] && items[0].cover;
        if (!cover || typeof cover !== 'string') return;
        var trimmed = cover.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('//')) {
          trimmed = 'https:' + trimmed;
        }
        if (!/^https?:\/\//i.test(trimmed)) return;
        var parsed = new URL(trimmed);
        if (parsed.protocol !== 'https:') return;
        var host = parsed.hostname.toLowerCase();
        var allowed = ['cdn.myanimelist.net', 'myanimelist.cdn-dena.com', 'images.weserv.nl', 'via.placeholder.com'];
        var isAllowed = allowed.some(function (entry) {
          return host === entry || host.endsWith('.' + entry);
        });
        if (!isAllowed) return;

        var proxyStatus = null;
        try {
          var proxyRaw = localStorage.getItem('rekonime.imageProxyStatus');
          if (proxyRaw) {
            var proxyParsed = JSON.parse(proxyRaw);
            var checkedAt = Number(proxyParsed && proxyParsed.checkedAt) || 0;
            var ttl = 6 * 60 * 60 * 1000;
            if (checkedAt && Date.now() - checkedAt <= ttl) {
              proxyStatus = proxyParsed && proxyParsed.ok === true ? true : (proxyParsed && proxyParsed.ok === false ? false : null);
            }
          }
        } catch (e) {
          proxyStatus = null;
        }

        var linkUrl = trimmed;
        if (host === 'images.weserv.nl') {
          linkUrl = trimmed;
        } else if (proxyStatus === true) {
          var normalized = trimmed.replace(/^https?:\/\//i, '').replace(/^\/\//, '');
          linkUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(normalized) +
            '&w=240&h=360&fit=cover&output=webp';
        }

        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = linkUrl;
        link.setAttribute('fetchpriority', 'high');
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      } catch (e) {
        // Ignore preload errors
      }
    })();
  </script>

  <script nonce="rekonime-inline">
    (function () {
      var links = document.querySelectorAll('link[data-async-style], link[data-noncritical]');
      if (!links.length) return;
      var enable = function (link) { link.media = 'all'; };
      var activate = function () {
        links.forEach(function (link) {
          if (link.media === 'all') return;
          link.addEventListener('load', function () { enable(link); }, { once: true });
          try {
            if (link.sheet) {
              enable(link);
            }
          } catch (e) {
            // Ignore cross-origin access errors
          }
        });
      };
      if ('requestAnimationFrame' in window) {
        requestAnimationFrame(function () {
          requestAnimationFrame(activate);
        });
      } else {
        setTimeout(activate, 0);
      }
    })();
  </script>

<body>
  <main class="app-container" id="app-container">
    <header class="header">
      <a class="logo logo-link" href="index.html" data-home-link data-action="home-shortcut"
        aria-label="Rekonime home (clears filters)">
        <div class="logo-icon" aria-hidden="true">R</div>
        <div class="logo-text">
          <span class="logo-title">Rekonime</span>
          <span class="logo-tagline">Anime worth your time</span>
        </div>
      </a>
      <div class="header-actions">
        <a class="btn btn-sm btn-outline" href="index.html" data-home-link aria-label="Back to catalog">Back to
          catalog</a>
        <button class="btn btn-sm btn-outline settings-btn" id="settings-toggle" type="button"
          aria-label="Open settings" title="Settings">
          <span class="settings-icon" aria-hidden="true">&#9881;</span>
          <span class="settings-label">Settings</span>
        </button>
      </div>
    </header>

    <section class="bookmarks-section is-empty" id="bookmarks-section">
      <div class="section-header">
        <div>
          <h2>Bookmarked</h2>
          <p class="section-subtitle" id="bookmarks-subtitle">Save titles with the star to keep them here.</p>
        </div>
      </div>
      <noscript>
        <div class="bookmarks-no-js">
          <h3>Bookmarks require JavaScript</h3>
          <p>Rekonime stores bookmarks locally in your browser, which needs JavaScript.</p>
          <ol>
            <li>Enable JavaScript in your browser settings.</li>
            <li>Browse the <a href="index.html">catalog</a>.</li>
            <li>Tap the star on any title to save it here.</li>
          </ol>
        </div>
      </noscript>
      <div class="anime-grid bookmarks-grid" id="bookmarks-grid"></div>
      <p class="bookmarks-empty" id="bookmarks-empty">No bookmarks yet. Star any anime to pin it here.</p>
    </section>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal" hidden inert>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title" tabindex="-1">
      <button class="modal-close" id="close-detail" type="button" aria-label="Close details">&times;</button>
      <div class="modal-body" id="detail-content">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <div class="modal-overlay settings-modal-overlay" id="settings-modal" hidden inert>
    <div class="modal-content settings-modal-content" role="dialog" aria-modal="true"
      aria-labelledby="settings-modal-title" tabindex="-1">
      <button class="modal-close" id="close-settings" type="button" aria-label="Close settings">&times;</button>
      <div class="settings-modal-body">
        <div class="settings-modal-header">
          <h2 class="settings-modal-title" id="settings-modal-title">Settings</h2>
          <p class="settings-modal-subtitle">Adjust playback and data usage.</p>
        </div>
        <div id="settings-content"></div>
      </div>
    </div>
  </div>

  <!-- Offline/Update Notifications -->
  <div id="offline-indicator" class="offline-indicator" role="status" aria-live="polite" hidden>
    <span class="offline-icon" aria-hidden="true">!</span>
    <div class="offline-content">
      <span class="offline-title">You're offline</span>
      <span class="offline-features">Checking offline features...</span>
    </div>
  </div>
  <div id="update-notification" class="update-notification" role="status" aria-live="polite" hidden>
    <div class="update-content">
      <span class="update-text">Update available</span>
      <button id="update-apply" class="update-btn" type="button">Update now</button>
      <button id="update-dismiss" class="update-dismiss" type="button" aria-label="Dismiss update">&times;</button>
    </div>
  </div>
