<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'nonce-rekonime-inline'; style-src 'self' 'nonce-rekonime-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://cdn.myanimelist.net https://myanimelist.cdn-dena.com https://via.placeholder.com https://i.ytimg.com data:; connect-src 'self' https://api.jikan.moe ws://localhost:* ws://127.0.0.1:*; frame-src https://www.youtube.com https://www.youtube-nocookie.com; form-action 'self'; upgrade-insecure-requests">
  <meta name="csp-nonce" content="rekonime-inline">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks - Rekonime</title>
  <meta name="description" content="Your saved anime on Rekonime.">
  <meta name="theme-color" content="#FFB7C5">
  <link rel="canonical" href="">
  <meta property="og:site_name" content="Rekonime">
  <meta property="og:title" content="Bookmarks - Rekonime">
  <meta property="og:description" content="Your saved anime on Rekonime.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="favicon.svg">
  <meta property="og:image:alt" content="Rekonime logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Bookmarks - Rekonime">
  <meta name="twitter:description" content="Your saved anime on Rekonime.">
  <meta name="twitter:image" content="favicon.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts - Sakura Theme (Noto Serif JP, Noto Sans JP, Playfair Display, DM Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.myanimelist.net" crossorigin>
  <link rel="dns-prefetch" href="https://api.jikan.moe">
  <link rel="preload" href="data/anime.preview.json" as="fetch" crossorigin="anonymous">
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="data/anime.full.json">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css" nonce="rekonime-inline">
  <link rel="stylesheet" href="/css/themes.css" nonce="rekonime-inline">
</head>

<body>
  <div class="app-container" id="app-container">
    <header class="header">
      <a class="logo logo-link" href="index.html" data-home-link data-action="home-shortcut"
        aria-label="Rekonime home (clears filters)">
        <div class="logo-icon" aria-hidden="true">R</div>
        <div class="logo-text">
          <span class="logo-title">Rekonime</span>
          <span class="logo-tagline">Anime worth your time</span>
        </div>
      </a>
      <div class="header-actions">
        <a class="btn btn-sm btn-outline" href="index.html" data-home-link aria-label="Back to catalog">Back to
          catalog</a>
        <button class="btn btn-sm btn-outline settings-btn" id="settings-toggle" type="button"
          aria-label="Open settings" title="Settings">
          <span class="settings-icon" aria-hidden="true">&#9881;</span>
          <span class="settings-label">Settings</span>
        </button>
      </div>
    </header>

    <section class="bookmarks-section is-empty" id="bookmarks-section">
      <div class="section-header">
        <div>
          <h2>Bookmarked</h2>
          <p class="section-subtitle" id="bookmarks-subtitle">Save titles with the star to keep them here.</p>
        </div>
      </div>
      <noscript>
        <div class="bookmarks-no-js">
          <h3>Bookmarks require JavaScript</h3>
          <p>Rekonime stores bookmarks locally in your browser, which needs JavaScript.</p>
          <ol>
            <li>Enable JavaScript in your browser settings.</li>
            <li>Browse the <a href="index.html">catalog</a>.</li>
            <li>Tap the star on any title to save it here.</li>
          </ol>
        </div>
      </noscript>
      <div class="anime-grid bookmarks-grid" id="bookmarks-grid"></div>
      <p class="bookmarks-empty" id="bookmarks-empty">No bookmarks yet. Star any anime to pin it here.</p>
    </section>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title" tabindex="-1">
      <button class="modal-close" id="close-detail" type="button" aria-label="Close details">&times;</button>
      <div class="modal-body" id="detail-content">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <div class="modal-overlay settings-modal-overlay" id="settings-modal" aria-hidden="true">
    <div class="modal-content settings-modal-content" role="dialog" aria-modal="true"
      aria-labelledby="settings-modal-title" tabindex="-1">
      <button class="modal-close" id="close-settings" type="button" aria-label="Close settings">&times;</button>
      <div class="settings-modal-body">
        <div class="settings-modal-header">
          <h2 class="settings-modal-title" id="settings-modal-title">Settings</h2>
          <p class="settings-modal-subtitle">Adjust playback and data usage.</p>
        </div>
        <div id="settings-content"></div>
      </div>
    </div>
  </div>

  <!-- Offline/Update Notifications -->
  <div id="offline-indicator" class="offline-indicator" role="status" aria-live="polite" aria-hidden="true">
    <span class="offline-icon" aria-hidden="true">!</span>
    <div class="offline-content">
      <span class="offline-title">You're offline</span>
      <span class="offline-features">Checking offline features...</span>
    </div>
  </div>
  <div id="update-notification" class="update-notification" role="status" aria-live="polite" aria-hidden="true">
    <div class="update-content">
      <span class="update-text">Update available</span>
      <button id="update-apply" class="update-btn" type="button">Update now</button>
      <button id="update-dismiss" class="update-dismiss" type="button" aria-label="Dismiss update">&times;</button>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
