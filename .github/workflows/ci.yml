name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Repo hygiene
        run: bun --silent run check:repo-hygiene

      - name: TypeScript typecheck
        run: bun --silent run typecheck

      - name: Unit tests
        run: bun --silent run test:unit

      - name: Integration tests
        run: bun --silent run test:integration

      - name: Python golden fixtures
        run: bun --silent run test:golden

      - name: Data validation
        run: bun --silent run data:validate

      - name: Coverage
        run: bun --silent run test:coverage

      - name: Coverage thresholds
        run: bun --silent run check:coverage-thresholds

      - name: Entrypoint dedup
        run: bun --silent run check:entrypoints

      - name: Build verification
        run: bun --silent run build:verify

      - name: Security checks
        run: bun --silent run check:security
