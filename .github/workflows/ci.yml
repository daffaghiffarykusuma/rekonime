name: CI

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Repo hygiene
        run: bun --silent run check:repo-hygiene

      - name: TypeScript typecheck
        run: bun --silent run typecheck

      - name: Python golden fixtures
        run: bun --silent run test:golden

      - name: Data validation
        run: bun --silent run data:validate

      - name: Tests with coverage
        # Runs the unit, integration, and contract suites once.
        run: bun --silent run test:coverage

      - name: Build verification
        run: bun --silent run build:verify

      - name: Security checks
        run: bun --silent run check:security

  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit scraper dependencies including transitive requirements
        run: python -m pip_audit --strict --requirement tools/scraper/requirements.txt
