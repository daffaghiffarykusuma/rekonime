name: CI

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Repo hygiene
        run: bun --silent run check:repo-hygiene

      - name: TypeScript typecheck
        run: bun --silent run typecheck

      - name: Unit tests
        run: bun --silent run test:unit

      - name: Integration tests
        run: bun --silent run test:integration

      - name: Python golden fixtures
        run: bun --silent run test:golden

      - name: Data validation
        run: bun --silent run data:validate

      - name: Coverage
        run: bun --silent run test:coverage

      - name: Build verification
        run: bun --silent run build:verify

      - name: Security checks
        run: bun --silent run check:security

  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit scraper dependencies including transitive requirements
        run: python -m pip_audit --strict --requirement tools/scraper/requirements.txt
